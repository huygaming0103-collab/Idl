kind = "web"
previewPath = "/"
title = "IDL Bot — TOS & Privacy Policy"
version = "1.0.0"
id = "artifacts/tos-pp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26035

[services.development]
run = "pnpm --filter @workspace/tos-pp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tos-pp", "run", "build" ]
serve = "static"
publicDir = "artifacts/tos-pp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26035"
BASE_PATH = "/"
